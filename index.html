<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Pilates 接龍報名</title>
  <link rel="stylesheet" href="styles.css?v=20260817-2" />
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">GROUP SIGN-UP</p>
        <h1>Pilates 接龍報名</h1>
        <p class="subtitle">12 個正式名額，額滿後自動進入 Waiting List。</p>
      </div>
      <div class="capacity" id="capacityBadge">— / 12</div>
    </section>

    <section class="status-card" id="connectionCard" hidden>
      <strong>尚未完成 Supabase 設定</strong>
      <span>請依 README 建立資料庫，再更新 config.js。</span>
    </section>

    <section>
      <div class="section-head"><h2>Confirmed</h2><span>1–12</span></div>
      <div class="card" id="confirmedList"></div>
    </section>

    <section>
      <div class="section-head"><h2>Waiting List</h2><span>13–18</span></div>
      <div class="card" id="waitingList"></div>
    </section>

    <div class="actions">
      <button class="primary" id="joinButton">＋ 我要報名</button>
      <button class="secondary" id="refreshButton">重新整理</button>
      <button class="secondary full" id="shareButton">分享目前名單</button>
    </div>

    <p class="footnote">多人同時加入時，由資料庫交易鎖定順序，不會互相覆蓋。取消後，候補名單會自動往前遞補。</p>
  </main>

  <dialog id="joinDialog">
    <form method="dialog" class="modal" id="joinForm">
      <h3>加入接龍</h3>
      <p>輸入你的名字。送出後系統會自動決定正式名額或候補順位。</p>
      <label>
        <span>名字</span>
        <input id="nameInput" maxlength="40" autocomplete="name" placeholder="例如 Bob" required />
      </label>
      <div class="modal-actions">
        <button value="cancel" class="secondary" type="button" id="closeDialogButton">取消</button>
        <button class="primary" type="submit" id="submitJoinButton">加入</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=20260817-2"></script>
  <script src="app.js?v=20260817-2"></script>
</body>
</html>
